# Minimal READY Linux Yocto layer metadata.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "readylinux"
BBFILE_PATTERN_readylinux = "^${LAYERDIR}/"
BBFILE_PRIORITY_readylinux = "8"

# Compatibility series have not yet been verified by a release-pinned metadata parse.
# Keep this candidate list synchronized with both layer READMEs until actual parse evidence exists.
LAYERSERIES_COMPAT_readylinux = "scarthgap styhead walnascar wrynose"
