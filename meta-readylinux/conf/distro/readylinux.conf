require conf/distro/poky.conf

DISTRO = "readylinux"
DISTRO_NAME = "READY Linux"
DISTRO_VERSION = "0.3-dev"

# CPU-first defaults. usrmerge is required by the systemd recipe in supported OE releases.
# No AI model weights or network services are part of base image.
DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager = "systemd"
